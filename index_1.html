<style>
:root{

.sky .town{position:absolute;inset-inline:0;bottom:0;height:min(40vh,320px);opacity:.66;

.sky .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,13,11,.1) 0%,rgba(18,13,11,.55) 46%,rgba(18,13,11,.92) 82%,var(--ground) 100%)}
.display{font-family:'Lalezar',cursive;font-size:clamp(38px,12vw,56px);line-height:1.05;color:var(--gold);
text-shadow:0 2px 0 #7A4A16,0 0 28px rgba(255,159,69,.35)}
.title{font-family:'Lalezar',cursive;font-size:24px;line-height:1.3;color:var(--ink)}
.h2{font-family:'Lalezar',cursive;font-size:19px;color:var(--gold);line-height:1.3}
.sub{color:var(--ink-2);font-size:15px;margin:0}
.tiny{color:var(--ink-3);font-size:13px;margin:0}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
.latin{font-family:'Inter',system-ui,sans-serif;direction:ltr}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 20px;
border-radius:var(--r-m);font-weight:800;font-size:17px;background:linear-gradient(180deg,#F2C465,#D69A2E);color:#2E1906;
box-shadow:0 5px 0 #8A5B12,0 12px 24px rgba(0,0,0,.45);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8A5B12,0 5px 12px rgba(0,0,0,.4)}
.btn:disabled{opacity:.38;transform:none;cursor:not-allowed;box-shadow:0 5px 0 #5A3C0C}
.btn.ghost{background:rgba(255,255,255,.02);color:var(--ink);border:1.5px solid var(--edge);box-shadow:none;font-weight:600}
.btn.ghost:active{transform:none;background:rgba(255,255,255,.06)}
.btn.danger{background:linear-gradient(180deg,#E0564F,#A82B2E);color:#fff;box-shadow:0 5px 0 #6E1B1D,0 12px 24px rgba(0,0,0,.45)}
.btn.night{background:linear-gradient(180deg,#6F7FD8,#4050A8);color:#fff;box-shadow:0 5px 0 #26306A,0 12px 24px rgba(0,0,0,.45)}
.btn.sm{min-height:42px;font-size:15px;padding:8px 14px;border-radius:var(--r-s);width:auto;box-shadow:0 3px 0 #8A5B12}
.btn.ghost.sm{box-shadow:none}
.btn.pulse{animation:btnPulse 1.4s ease-in-out infinite}
@keyframes btnPulse{50%{filter:brightness(1.18);box-shadow:0 5px 0 #8A5B12,0 0 0 6px rgba(233,180,76,.25)}}
.btn:focus-visible,.icon-btn:focus-visible,.pl:focus-visible,.ch:focus-visible,.seg button:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--edge);display:grid;place-items:center;color:var(--ink-2);
background:rgba(29,21,16,.7);font-size:18px;flex:none;position:relative}
.icon-btn .dotn{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--mafia);color:#fff;
font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.screen{flex:1;display:flex;flex-direction:column;gap:16px}
.screen.enter{animation:enterF .36s var(--ease) both}
.screen.enter.back{animation-name:enterB}
@keyframes enterF{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes enterB{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.card{background:linear-gradient(180deg,var(--surface),var(--night-2));border:1px solid var(--edge);border-radius:var(--r-l);padding:16px}
.hr{height:1px;background:var(--edge);margin:2px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}
.topbar .t{font-family:'Lalezar',cursive;font-size:21px;text-align:center;flex:1;min-width:0;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.topbar .t small{display:block;font-family:'Tajawal',sans-serif;font-size:12px;color:var(--ink-3);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:rgba(233,180,76,.12);
border:1px solid rgba(233,180,76,.3);color:var(--gold);font-size:13px;font-weight:800;white-space:nowrap}
.chip.red{background:rgba(208,67,63,.15);border-color:rgba(208,67,63,.45);color:var(--mafia-ink)}
.chip.blue{background:rgba(74,139,224,.15);border-color:rgba(74,139,224,.45);color:var(--cop-ink)}
.chip.green{background:rgba(52,174,116,.15);border-color:rgba(52,174,116,.45);color:var(--doc-ink)}
.chip.mute{background:rgba(255,255,255,.04);border-color:var(--edge);color:var(--ink-3)}
.note{background:rgba(255,255,255,.035);border:1px solid var(--edge);border-radius:var(--r-s);padding:11px 14px;font-size:14.5px;color:var(--ink-2)}
.note b{color:var(--ink)}
.banner{text-align:center;padding:11px 14px;border-radius:var(--r-m);border:1px dashed var(--edge-2);color:var(--ink-2);font-size:14.5px;background:rgba(0,0,0,.18)}
.banner b{color:var(--gold)}
.alert{background:rgba(208,67,63,.12);border:1px solid rgba(208,67,63,.45);border-radius:var(--r-m);padding:14px 16px;font-size:14.5px;color:#FFD9DA;text-align:center}
.alert b{font-family:'Lalezar',cursive;font-weight:400;font-size:18px;color:var(--mafia-ink);display:block}
.steps{display:flex;gap:4px;align-items:center;justify-content:center;padding:2px 0}
.steps .s{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);padding:3px 8px;border-radius:99px;transition:all .3s ease;white-space:nowrap}
.steps .s i{font-style:normal;font-size:13px;filter:grayscale(1);opacity:.6}
.steps .s.on{background:rgba(233,180,76,.14);color:var(--gold);font-weight:800}
.steps .s.on i{filter:none;opacity:1}
.steps .s.done{color:var(--ink-2)}
.steps .s.done i{opacity:.9;filter:grayscale(.4)}
.steps .s span{display:none}
.steps .s.on span{display:inline}
.steps .sep{width:10px;height:1px;background:var(--edge)}
.hero{text-align:center;padding:22px 0 4px}
.hang{display:flex;flex-direction:column;align-items:center}
.lantern{font-size:28px;filter:drop-shadow(0 0 16px rgba(255,159,69,.6));animation:sway 5s ease-in-out infinite;transform-origin:top center}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.rope{width:2px;height:18px;background:linear-gradient(#6A4A26,#33210E)}
.plaque{position:relative;display:inline-block;padding:14px 34px 18px;border-radius:20px;
background:linear-gradient(180deg,#6E4C29,#472E17 60%,#3A250F);border:2px solid #2E1C0C;
box-shadow:inset 0 2px 0 rgba(255,222,166,.22),inset 0 -4px 10px rgba(0,0,0,.55),0 16px 34px rgba(0,0,0,.55);
transform-origin:top center;animation:sway 7s ease-in-out infinite}
.plaque::before,.plaque::after{content:"";position:absolute;top:11px;width:7px;height:7px;border-radius:50%;

.plaque::before{inset-inline-start:13px}.plaque::after{inset-inline-end:13px}

.plaque .tag{font-family:'Lalezar',cursive;font-size:18px;color:#E8C992;margin-top:-4px}
.strip{position:relative;overflow:hidden;height:70px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.strip .rail{display:flex;gap:8px;width:max-content;animation:drift 50s linear infinite}
.strip img{width:62px;height:62px;border-radius:16px;object-fit:cover;border:1px solid rgba(233,180,76,.25);opacity:.85}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;padding:14px;border-radius:var(--r-l);
border:1.5px solid var(--edge);background:linear-gradient(180deg,var(--surface),var(--night-2));transition:border-color .15s ease,transform .15s ease;color:var(--ink)}
.mode:active{transform:scale(.98)}
.mode .em{font-size:28px;line-height:1}

.career{display:flex;gap:8px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ch{position:relative;border-radius:var(--r-s);overflow:hidden;border:2px solid transparent;background:var(--surface);aspect-ratio:1;max-width:100%;padding:0}

.pl{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:var(--r-s);background:var(--surface);border:1px solid var(--edge);

button.pl:active,.pl.tap:active{transform:scale(.985)}

.pl .who{flex:1;min-width:0}

.pl.disabled{opacity:.35;pointer-events:none}

.toggle[aria-checked="true"] .sw{background:rgba(233,180,76,.35);border-color:var(--gold)}

.lbl{font-size:13.5px;color:var(--ink-2);margin-bottom:6px;font-weight:700}

function boardAccuracy(marks, isMafia){

Object.keys(marks||{}).forEach(id=>{ const m=marks[id]; if(!m||!m.m) return;
if(m.m==='sus'){ sus++; if(isMafia(id)) susHit++; } else { ok++; if(!isMafia(id)) okHit++; } });
const total=sus+ok, hits=susHit+okHit;
return {sus,susHit,ok,okHit,total,hits,pct: total?Math.round(hits/total*100):null};
}
function tallyReveal(host, entries, order, onDone){

entries.forEach(e=>{

let i=0, tid=null, finished=false;
function apply(v, anim){

m.n+=(v.w||1); m.voters.push(v.voter+(v.w>1?' ×٢':''));
m.row.querySelector('.vc').textContent=m.n;

}
function finish(){ if(finished) return; finished=true; clearTimeout(tid); while(i<order.length) apply(order[i++],false); SFX.play('gavel'); HAPTIC.soft(); onDone&&onDone(); }
function step(){ if(i>=order.length){ finish(); return; } apply(order[i++],true); tid=setTimeout(step, 700); }
tid=setTimeout(step, 500);
host.addEventListener('click', finish);
return finish;
}
function ringTimer(total, getLeft, o){
o=o||{};
const C=2*Math.PI*78;
const el=$(`<div class="ring"><svg viewBox="0 0 170 170"><circle class="bg" cx="85" cy="85" r="78"/><circle class="fg" cx="85" cy="85" r="78" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="timer num">--</div></div>`);
const fg=el.querySelector('.fg'), tx=el.querySelector('.timer');
let lastLeft=null, doneFired=false;
const draw=()=>{
if(!el.isConnected && lastLeft!==null){ clearInterval(iv); return; }
const left=Math.max(0,Math.round(getLeft()));
const m=Math.floor(left/60), s=left%60;
tx.textContent = total>=60 ? `${m}:${String(s).padStart(2,'0')}` : String(left);
fg.style.strokeDashoffset = String(C*(1-left/Math.max(1,total)));
el.classList.toggle('low', left<=Math.min(20,total*0.25) && left>0);
tx.classList.toggle('done', left===0);
if(left!==lastLeft && left>0 && left<=5 && !o.paused?.()) SFX.play('tick');
if(left===0 && !doneFired && lastLeft!==null){ doneFired=true; SFX.play('gavel'); HAPTIC.soft(); o.onDone&&o.onDone(); }
lastLeft=left;
};
const iv=setInterval(draw, 250); draw();
el.update=draw;
return el;
}

function matchHeadline(log, winner, nameOf, isMaf){
const elims=log.filter(e=>e.t==='elim'), saves=log.filter(e=>e.t==='saved'), kills=log.filter(e=>e.t==='killed');
const noElim=log.filter(e=>e.t==='no_elim'||e.t==='no_nominee');
const firstBad=elims.find(e=>!isMaf(e.target));
if(winner==='mafia' && elims.length && elims.every(e=>!isMaf(e.target))) return 'مرّوا من قدامكم وما حسّيتوا';
if(winner==='town' && saves.length>=2) return 'الليلة اللي ما نامت فيها الحارة';
if(winner==='town' && elims.length===1) return 'ضربة وحدة وخلصت السالفة';
if(firstBad && elims.length>=2) return 'ليلة ظلمنا '+nameOf(firstBad.target);
if(noElim.length>=2) return 'حارة ما تقدر تقرر';
if(winner==='mafia' && kills.length>=3) return 'الحارة نقصت وحدة وحدة';
if(saves.length===1) return 'فيه أيد وقفت في وقتها';

}
function computeAwards(log, players, nameOf, isMaf, extra){
const out=[], voteLogs=log.filter(e=>e.t==='votes');
const hitM={}, hitI={}, against={};
voteLogs.forEach(e=>Object.entries(e.map||{}).forEach(([v,t])=>{ if(t==null) return;
against[t]=(against[t]||0)+1;
if(isMaf(t)) hitM[v]=(hitM[v]||0)+1; else hitI[v]=(hitI[v]||0)+1; }));
const eagle=Object.entries(hitM).filter(([k])=>!isMaf(k)).sort((a,b)=>b[1]-a[1])[0];
if(eagle) out.push({em:'🦅',t:'عين الصقر',w:nameOf(eagle[0]),d:`صوّت على المافيا ${eagle[1]} ${plural(eagle[1],'مرة','مرات')}.`});
const surv=players.filter(p=>p.role==='mafia'&&p.alive).sort((a,b)=>(against[a.id]||0)-(against[b.id]||0))[0];
if(surv) out.push({em:'🎭',t:'الممثل',w:surv.name,d:`مافيا ونجا للنهاية بـ ${against[surv.id]||0} صوت ضده.`});
const saves=log.filter(e=>e.t==='saved').length, doc=players.find(p=>p.role==='doctor');
if(saves&&doc) out.push({em:'🩺',t:'الفزعة',w:doc.name,d:`أنقذ ${saves} ${plural(saves,'مرة','مرات')} في وقتها.`});
const hunches={}; log.filter(e=>e.t==='hunch'&&e.hit).forEach(e=>hunches[e.who]=(hunches[e.who]||0)+1);
const hb=Object.entries(hunches).sort((a,b)=>b[1]-a[1])[0];
if(hb) out.push({em:'🔮',t:'صاحب الحدس',w:nameOf(hb[0]),d:`توقّع هدف المافيا ${hb[1]} ${plural(hb[1],'مرة','مرات')}.`});
if(extra&&extra.reader) out.push({em:'👁️',t:'قارئ الوجوه',w:extra.reader.name,d:`دقة ظنونه ${extra.reader.pct}٪ من ${extra.reader.total} علامات.`});
const bad=log.find(e=>e.t==='elim'&&!isMaf(e.target));
if(bad) out.push({em:'😔',t:'ظلمناه',w:nameOf(bad.target),d:`بريء وأقصيتوه بـ ${bad.votes} صوت.`});
const wrong=Object.entries(hitI).filter(([k])=>!isMaf(k)).sort((a,b)=>b[1]-a[1])[0];
if(wrong&&wrong[1]>=2) out.push({em:'🤐',t:'يا ليتك ساكت',w:nameOf(wrong[0]),d:`صوّت على الأبرياء ${wrong[1]} مرات.`});
return out;
}

function lResolveNight(){
const tally={}; Object.values(L.mafiaVotes).forEach(t=>{ if(t) tally[t]=(tally[t]||0)+1; });
let target=null; const ks=Object.keys(tally);
if(ks.length){ const mx=Math.max(...ks.map(k=>tally[k])); target=+shuffle(ks.filter(k=>tally[k]===mx))[0]; }
Object.entries(L.hunch).forEach(([w,t])=>{ if(t) L.log.push({n:L.night,t:'hunch',who:+w,target:t,hit:t===target}); });
const prot=L.nightAct.protect||null; L.lastProtect=prot;
if(prot) L.log.push({n:L.night,t:'protect',target:prot});
if(target && target===prot){ L.save=true; L.morningMsg='الحارة صحت وما نقص أحد.'; L.log.push({n:L.night,t:'saved',target}); }
else if(target){ const v=LP(target); v.alive=false; L.kill=target; L.morningMsg=`«${v.name}» ما صحا اليوم.`; L.log.push({n:L.night,t:'killed',target}); }
else L.morningMsg='الليلة عدت على خير.';
lgo('morning');
if(L.kill){ curtain('💔','صباح حزين', L.morningMsg, '#3A1614', 'death', 2200); shake(); HAPTIC.hit(); }
else curtain('🌅','صباح الحارة', L.morningMsg, '#3A2412', L.save?'save':'morning', 2000);
}

LV.will = () => {

el.appendChild(lBar('الوصية')); el.appendChild(stepper('morning'));

const ring=ringTimer(15,()=>left); el.insertBefore(ring, el.lastChild.nextSibling);
lStopTimer(); lTimer=setInterval(()=>{ left=Math.max(0,left-1); ring.update(); if(!left){ lStopTimer(); b.classList.add('pulse'); } },1000);

function lMakeEvent(){
if(!L.settings.events) return null;
const n=lAlive().length, m=lMafia().length, ks=['calm','calm','short','quick','quick'];
if(L.settings.discuss>0) ks.push('long','long','long');
if(n>=5) ks.push('oneAcc','oneAcc','oneAcc','curfew','curfew');
if(n>=6) ks.push('tribunal','tribunal','blackout','blackout');
if(n>=6 && m>=1) ks.push('rumor','rumor','rumor');
const k=pick(ks);
if(k==='rumor'){ const mm=pick(lMafia()); const rest=shuffle(lAlive().filter(p=>p.id!==mm.id)).slice(0,2);
return {k, ids:shuffle([mm.id,...rest.map(p=>p.id)])}; }
return {k};
}
function lPressure(){
let streak=0;
for(let d=L.day-1; d>=Math.max(1,L.day-2); d--){
const no=L.log.some(e=>e.n===d&&(e.t==='no_elim'||e.t==='no_nominee')), el=L.log.some(e=>e.n===d&&e.t==='elim');
if(no&&!el) streak++; else break;
}
return streak>=2;
}
function lNeed(){ return (L.event&&L.event.k==='oneAcc')||lPressure() ? 1 : 2; }
function lStartDay(){
L.day++; L.event=lMakeEvent();
if(L.event) L.log.push({n:L.day,t:'event',k:L.event.k});
L.timerLeft=eventDiscuss(L.settings.discuss, L.event); L.timerPaused=false;
lgo('discussion');
if(L.event){ SFX.play('event'); }
}
function lCheckWin(){
const m=lMafia().length, o=lAlive().length-m;
if(m===0) L.winner='town'; else if(m>=o) L.winner='mafia'; else return false;
L.revealIdx=0;
if(!L.recorded){ L.recorded=true; const aw=computeAwards(L.log,L.players,lName,lIsMaf,{});
CAREER.add({town:L.winner==='town', mafiaW:L.winner==='mafia', players:L.players, mvp:aw[0]&&aw[0].w}); }
lgo('ending');
curtain(L.winner==='mafia'?'🎩':'🏘️', L.winner==='mafia'?'المافيا فازت':'فازت الحارة', 'يلا نكشف الحقيقة', L.winner==='mafia'?'#3A1010':'#3A2A10', L.winner==='mafia'?'win_mafia':'win_town', 2600);
return true;
}

function lCloseAccuse(){
const c={}; Object.values(L.accuse).forEach(t=>{ if(t) c[t]=(c[t]||0)+1; });
const need=lNeed(); L.need=need;
L.nomCount=c; L.candidates=Object.keys(c).filter(k=>c[k]>=need).map(Number);
L.log.push({n:L.day,t:'accusations',map:Object.assign({},L.accuse),need});
lgo('accuseResult'); SFX.play('tally');
}

function phaseCurtain(){
const r=S.room, pk=r.phase+'|'+r.night+'|'+r.day+'|'+r.tie_round;
if(pk===lastPhaseKey) return;
const first=lastPhaseKey===null; lastPhaseKey=pk;
if(first) return;
if(r.phase==='night'){ curtain('🌙',`الليلة ${r.night}`,pickLine('night'),'#1B2140','night'); HAPTIC.night(); }
else if(r.phase==='morning'){ if(r.elim){ curtain('💔','صباح حزين',r.morning_msg,'#3A1614','death'); shake(); HAPTIC.hit(); } else curtain('🌅','صباح الحارة',r.morning_msg,'#3A2412',/وقفتها/.test(r.morning_msg||'')?'save':'morning'); }
else if(r.phase==='day'){ if(r.event) SFX.play('event'); }
else if(r.phase==='accuse'){ SFX.play('accuse'); }
else if(r.phase==='defense'){ curtain('🎙️', r.tie_round?'المواجهة':'الكلمة الأخيرة', (r.candidates||[]).map(oName).join(' · '), '#2A1A12', 'gavel', 1600); }
else if(r.phase==='vote'){ SFX.play('gavel'); }
else if(r.phase==='elimination'){ SFX.play('eliminate'); shake(); HAPTIC.hit(); }
else if(r.phase==='ended'){ ui.revealN=0; const mw=r.winner==='mafia'; curtain(mw?'🎩':'🏘️', mw?'المافيا فازت':'فازت الحارة','يلا نكشف الحقيقة', mw?'#3A1010':'#3A2A10', mw?'win_mafia':'win_town', 2600); }
}

const bad=NET.checked && NET.ok===false;
if(bad){
const a=$(`<div class="alert"><b>الغرف ما تشتغل من هنا</b><div style="margin-top:4px">${esc(NET.reason)}</div></div>`);
if(BUILD==='artifact'){ a.appendChild($(`<a class="btn sm" style="margin-top:12px;width:100%;text-decoration:none" href="${HOSTED_URL}" target="_blank" rel="noopener">افتح رابط الحارة ↗</a>`)); }
else { const r=$(`<button class="btn ghost sm" style="margin-top:10px">جرّب مرة ثانية</button>`); r.onclick=async()=>{ NET.checked=false; render(); await probeNet(); render(); }; a.appendChild(r); }
el.appendChild(a);
}
const mk=$(`<button class="btn" ${bad?'disabled':''}>افتح غرفة جديدة</button>`);
mk.onclick=()=>{ ui.entry='create'; ui.draftName=store.get('hartna_name',''); ui.draftChar=null; ui.taken=[]; render(); };
const jn=$(`<button class="btn ghost" ${bad?'disabled':''}>عندي كود — ادخل غرفة</button>`);
jn.onclick=()=>{ ui.entry='code'; render(); };
el.appendChild(mk); el.appendChild(jn);
return el;
}
function render(){
if(L){ lRender(); return; }
if(SESS){ renderOnline(); return; }
const map={rules:vRules, online:vOnline, code:vCode, create:()=>vPick('create'), join:()=>vPick('join')};
const v=map[ui.entry]||vHome;
const order={home:0,rules:1,online:1,code:2,create:2,join:3}[ui.entry]||0;
mount(v(),{key:'pre|'+ui.entry, order, mood:'home'});
}
SESS = BUILD==='artifact' ? null : loadSess();
try{
const code=new URLSearchParams(location.search).get('room');
if(code && !SESS){ ui.joinCode=code.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5); ui.entry='code'; }
}catch(e){}
probeNet();
splashIntro(()=>{ render(); if(SESS){ tick(true).then(startPoll); } });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && SESS) tick(true); });
</script>
</body>
